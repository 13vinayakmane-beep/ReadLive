<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Stories - ReadLive Admin</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f6f4ff;
            color: #222;
        }

        /* ================================
           ADMIN SIDEBAR
        ================================= */

        .admin-sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 230px;
            height: 100vh;
            background: white;
            border-right: 1px solid #e8e8e8;
            padding: 28px 15px;
            z-index: 1000;
        }

        .admin-logo {
            font-size: 27px;
            font-weight: 800;
            color: #6c4cff;
            padding: 0 15px;
            margin-bottom: 8px;
        }

        .admin-logo span {
            color: #222;
        }

        .admin-label {
            color: #999;
            font-size: 10px;
            font-weight: 600;
            padding: 0 15px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .admin-nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .admin-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 9px;
            color: #555;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }

        .admin-link:hover {
            background: #f1edff;
            color: #6c4cff;
        }

        .admin-link.active {
            background: #eee9ff;
            color: #6c4cff;
        }

        .admin-logout {
            position: absolute;
            bottom: 25px;
            left: 15px;
            right: 15px;
            color: #e53935;
        }

        .admin-logout:hover {
            background: #fff0f0;
            color: #e53935;
        }

        /* ================================
           MAIN
        ================================= */

        .main {
            margin-left: 230px;
            padding: 30px;
            min-height: 100vh;
        }

        .top-section {
            margin-bottom: 25px;
        }

        .top-section h1 {
            font-size: 28px;
        }

        .top-section p {
            color: #777;
            margin-top: 6px;
        }

        /* ================================
           STATS
        ================================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e5e5e5;
        }

        .stat-card span {
            color: #777;
            font-size: 14px;
        }

        .stat-card h2 {
            margin-top: 8px;
            color: #6c4cff;
        }

        /* ================================
           SEARCH
        ================================= */

        .search-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e5e5e5;
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #6c4cff;
        }

        /* ================================
           STORIES
        ================================= */

        .stories-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .story-card {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            overflow: hidden;
        }

        .story-content {
            padding: 20px;
            min-height: 150px;
        }

        .story-user {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .story-date {
            font-size: 12px;
            color: #888;
            margin-bottom: 15px;
        }

        .story-text {
            font-size: 14px;
            line-height: 1.6;
            color: #555;
            word-break: break-word;
        }

        .story-actions {
            padding: 15px 20px;
            border-top: 1px solid #eee;
        }

        /* ================================
           BUTTONS
        ================================= */

        .action-btn {
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin-right: 5px;
        }

        .view-btn {
            background: #f0edff;
            color: #6c4cff;
        }

        .delete-btn {
            background: #ffe8e8;
            color: #d33;
        }

        .action-btn:hover {
            opacity: 0.8;
        }

        /* ================================
           EMPTY MESSAGE
        ================================= */

        .empty-message {
            grid-column: 1 / -1;
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            text-align: center;
            padding: 60px 20px;
            color: #777;
        }

        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 1000px) {

            .stories-container {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 768px) {

            .admin-sidebar {
                width: 65px;
                padding: 20px 8px;
            }

            .admin-logo {
                font-size: 0;
                text-align: center;
            }

            .admin-logo:before {
                content: "R";
                font-size: 25px;
                font-weight: bold;
            }

            .admin-label {
                display: none;
            }

            .admin-link {
                justify-content: center;
                padding: 12px;
            }

            .admin-link span {
                display: none;
            }

            .admin-logout {
                left: 8px;
                right: 8px;
            }

            .main {
                margin-left: 65px;
                padding: 20px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .stories-container {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- =================================
         ADMIN SIDEBAR
    ================================== -->

    <aside class="admin-sidebar">

        <div class="admin-logo">
            Read<span>Live</span>
        </div>

        <div class="admin-label">
            Administrator
        </div>

        <nav class="admin-nav">

            <a href="admin-dashboard.html" class="admin-link">

                📊
                <span>Dashboard</span>

            </a>


            <a href="admin-books.html" class="admin-link">

                📚
                <span>Manage Books</span>

            </a>


            <a href="admin-users.html" class="admin-link">

                👥
                <span>Manage Users</span>

            </a>


            <a href="admin-live-sessions.html" class="admin-link">

                🔴
                <span>Manage Live Sessions</span>

            </a>


            <a href="admin-stories.html" class="admin-link active">

                📖
                <span>Stories</span>

            </a>


            <a href="admin-settings.html" class="admin-link">

                ⚙️
                <span>Settings</span>

            </a>

        </nav>


        <a href="login.html" class="admin-link admin-logout">

            🚪
            <span>Logout</span>

        </a>

    </aside>


    <!-- =================================
         MAIN CONTENT
    ================================== -->

    <div class="main">


        <div class="top-section">

            <h1>
                Manage Stories
            </h1>

            <p>
                View and manage stories posted by ReadLive users.
            </p>

        </div>


        <!-- =================================
             STATISTICS
        ================================== -->

        <div class="stats">

            <div class="stat-card">

                <span>
                    Total Stories
                </span>

                <h2 id="totalStories">
                    0
                </h2>

            </div>


            <div class="stat-card">

                <span>
                    Stories This Page
                </span>

                <h2 id="visibleStories">
                    0
                </h2>

            </div>

        </div>


        <!-- =================================
             SEARCH
        ================================== -->

        <div class="search-box">

            <input
                type="text"
                id="searchStory"
                placeholder="Search stories by user or story text..."
                onkeyup="searchStories()"
            >

        </div>


        <!-- =================================
             STORIES
        ================================== -->

        <div
            class="stories-container"
            id="storiesContainer"
        >

        </div>


    </div>


    <!-- =================================
         JAVASCRIPT
    ================================== -->

    <script>

        // GET STORIES

        let stories =
            JSON.parse(
                localStorage.getItem(
                    "readliveStories"
                )
            ) || [];


        // DISPLAY STORIES

        function renderStories(
            storyList = stories
        ) {

            const container =
                document.getElementById(
                    "storiesContainer"
                );

            container.innerHTML = "";


            // UPDATE COUNTS

            document.getElementById(
                "totalStories"
            ).innerText = stories.length;


            document.getElementById(
                "visibleStories"
            ).innerText = storyList.length;


            // NO STORIES

            if (storyList.length === 0) {

                container.innerHTML = `

                    <div class="empty-message">

                        No stories found.

                    </div>

                `;

                return;

            }


            // DISPLAY STORIES

            storyList.forEach(
                function(story, index) {

                    const actualIndex =
                        stories.indexOf(story);


                    container.innerHTML += `

                        <div class="story-card">

                            <div class="story-content">

                                <div class="story-user">

                                    👤
                                    ${
                                        escapeHTML(
                                            story.username ||
                                            story.user ||
                                            "User"
                                        )
                                    }

                                </div>


                                <div class="story-date">

                                    ${
                                        story.date ||
                                        "Date not available"
                                    }

                                </div>


                                <div class="story-text">

                                    ${
                                        escapeHTML(
                                            story.text ||
                                            story.content ||
                                            "No story content"
                                        )
                                    }

                                </div>

                            </div>


                            <div class="story-actions">

                                <button
                                    class="action-btn view-btn"
                                    onclick="viewStory(${actualIndex})"
                                >

                                    View

                                </button>


                                <button
                                    class="action-btn delete-btn"
                                    onclick="deleteStory(${actualIndex})"
                                >

                                    Delete

                                </button>

                            </div>

                        </div>

                    `;

                }
            );

        }


        // SEARCH STORIES

        function searchStories() {

            const search =
                document
                .getElementById(
                    "searchStory"
                )
                .value
                .toLowerCase();


            const filtered =
                stories.filter(
                    function(story) {

                        const username =
                            (
                                story.username ||
                                story.user ||
                                ""
                            ).toLowerCase();


                        const text =
                            (
                                story.text ||
                                story.content ||
                                ""
                            ).toLowerCase();


                        return (
                            username.includes(search) ||
                            text.includes(search)
                        );

                    }
                );


            renderStories(filtered);

        }


        // VIEW STORY

        function viewStory(index) {

            const story =
                stories[index];


            if (!story) {
                return;
            }


            alert(

                "User: " +
                (
                    story.username ||
                    story.user ||
                    "User"
                ) +

                "\n\nStory:\n" +

                (
                    story.text ||
                    story.content ||
                    "No content"
                )

            );

        }


        // DELETE STORY

        function deleteStory(index) {

            if (!stories[index]) {
                return;
            }


            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this story?"
                );


            if (!confirmDelete) {
                return;
            }


            stories.splice(index, 1);


            localStorage.setItem(
                "readliveStories",
                JSON.stringify(stories)
            );


            renderStories();

        }


        // SECURITY

        function escapeHTML(text) {

            const div =
                document.createElement("div");

            div.textContent = text;

            return div.innerHTML;

        }


        // LOAD STORIES

        renderStories();

    </script>


</body>

</html>
