<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReadLive - Create Account</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="logo">
                Read<span>Live</span>
            </div>

            <h1>Create Account</h1>

            <p class="subtitle">
                Join ReadLive and start your reading journey.
            </p>

            <form id="registerForm">

                <div class="form-group">
                    <label>Full Name</label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Username</label>

                    <input
                        type="text"
                        id="username"
                        placeholder="@username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >
                </div>

                <button type="submit" class="main-btn">
                    Create Account
                </button>

            </form>

            <p class="bottom-text">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </div>


    <script>
    const registerForm = document.getElementById("registerForm");

    registerForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        // Get values from input fields
        const username = document.getElementById("username").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        // Check if passwords match
        if (password !== confirmPassword) {
            alert("Passwords do not match!");
            return;
        }

        try {
            // Send user details to backend API
            const response = await fetch("http://https://readlive-backend.onrender.com/api/auth/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: username,
                    email: email,
                    password: password
                })
            });

            const data = await response.json();

            if (response.ok) {
                alert("Account created successfully!");
                window.location.href = "login.html";
            } else {
                alert(data.message || "Registration failed!");
            }
        } catch (error) {
            alert("Cannot connect to backend server. Make sure node server is running!");
        }
    });
</script>

</body>
</html>
