<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Live Sessions - ReadLive Admin</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f6f4ff;
            color: #222;
        }


        /* ================================
           ADMIN SIDEBAR
        ================================= */

        .admin-sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 230px;
            height: 100vh;
            background: white;
            border-right: 1px solid #e8e8e8;
            padding: 28px 15px;
            z-index: 1000;
        }

        .admin-logo {
            font-size: 27px;
            font-weight: 800;
            color: #6c4cff;
            padding: 0 15px;
            margin-bottom: 8px;
        }

        .admin-logo span {
            color: #222;
        }

        .admin-label {
            color: #999;
            font-size: 10px;
            font-weight: 600;
            padding: 0 15px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .admin-nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .admin-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 9px;
            color: #555;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }

        .admin-link:hover {
            background: #f1edff;
            color: #6c4cff;
        }

        .admin-link.active {
            background: #eee9ff;
            color: #6c4cff;
        }

        .admin-logout {
            position: absolute;
            bottom: 25px;
            left: 15px;
            right: 15px;
            color: #e53935;
        }

        .admin-logout:hover {
            background: #fff0f0;
            color: #e53935;
        }


        /* ================================
           MAIN
        ================================= */

        .main {
            margin-left: 230px;
            padding: 30px;
            min-height: 100vh;
        }

        .top-section {
            margin-bottom: 25px;
        }

        .top-section h1 {
            font-size: 28px;
        }

        .top-section p {
            color: #777;
            margin-top: 6px;
        }


        /* ================================
           STATS
        ================================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e5e5e5;
        }

        .stat-card span {
            color: #777;
            font-size: 14px;
        }

        .stat-card h2 {
            margin-top: 8px;
            color: #6c4cff;
        }


        /* ================================
           SEARCH
        ================================= */

        .search-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e5e5e5;
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #6c4cff;
        }


        /* ================================
           SESSION TABLE
        ================================= */

        .sessions-container {
            background: white;
            border-radius: 12px;
            border: 1px solid #e5e5e5;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 950px;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #fafafa;
            color: #555;
            font-size: 14px;
        }

        td {
            font-size: 14px;
        }

        tr:hover {
            background: #fafafa;
        }


        /* ================================
           SESSION TITLE
        ================================= */

        .session-title {
            font-weight: 600;
        }

        .book-name {
            color: #777;
            font-size: 13px;
            margin-top: 4px;
        }


        /* ================================
           STATUS
        ================================= */

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .live-status {
            background: #e7f8ed;
            color: #1d8a45;
        }

        .ended-status {
            background: #eeeeee;
            color: #777;
        }


        /* ================================
           BUTTONS
        ================================= */

        .action-btn {
            border: none;
            padding: 7px 11px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin-right: 5px;
        }

        .view-btn {
            background: #f0edff;
            color: #6c4cff;
        }

        .join-btn {
            background: #6c4cff;
            color: white;
        }

        .remove-btn {
            background: #ffe8e8;
            color: #d33;
        }

        .action-btn:hover {
            opacity: 0.8;
        }


        /* ================================
           EMPTY MESSAGE
        ================================= */

        .empty-message {
            text-align: center;
            padding: 50px 20px;
            color: #777;
        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 768px) {

            .admin-sidebar {
                width: 65px;
                padding: 20px 8px;
            }

            .admin-logo {
                font-size: 0;
                text-align: center;
            }

            .admin-logo:before {
                content: "R";
                font-size: 25px;
                font-weight: bold;
            }

            .admin-label {
                display: none;
            }

            .admin-link {
                justify-content: center;
                padding: 12px;
            }

            .admin-link span {
                display: none;
            }

            .admin-logout {
                left: 8px;
                right: 8px;
            }

            .main {
                margin-left: 65px;
                padding: 20px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- =================================
         ADMIN SIDEBAR
    ================================== -->

    <aside class="admin-sidebar">

        <div class="admin-logo">
            Read<span>Live</span>
        </div>

        <div class="admin-label">
            Administrator
        </div>

        <nav class="admin-nav">

            <a href="admin-dashboard.html" class="admin-link">

                📊
                <span>Dashboard</span>

            </a>


            <a href="admin-books.html" class="admin-link">

                📚
                <span>Manage Books</span>

            </a>


            <a href="admin-users.html" class="admin-link">

                👥
                <span>Manage Users</span>

            </a>


            <a
                href="admin-live-sessions.html"
                class="admin-link active">

                🔴
                <span>Manage Live Sessions</span>

            </a>


            <a href="admin-stories.html" class="admin-link">

                📖
                <span>Stories</span>

            </a>


            <a href="admin-settings.html" class="admin-link">

                ⚙️
                <span>Settings</span>

            </a>

        </nav>


        <a
            href="login.html"
            class="admin-link admin-logout">

            🚪
            <span>Logout</span>

        </a>

    </aside>


    <!-- =================================
         MAIN CONTENT
    ================================== -->

    <div class="main">


        <div class="top-section">

            <h1>
                Manage Live Sessions
            </h1>

            <p>
                Monitor live reading sessions created by users.
            </p>

        </div>


        <!-- =================================
             STATISTICS
        ================================== -->

        <div class="stats">

            <div class="stat-card">

                <span>
                    Total Sessions
                </span>

                <h2 id="totalSessions">
                    0
                </h2>

            </div>


            <div class="stat-card">

                <span>
                    Currently Live
                </span>

                <h2 id="liveSessions">
                    0
                </h2>

            </div>


            <div class="stat-card">

                <span>
                    Ended Sessions
                </span>

                <h2 id="endedSessions">
                    0
                </h2>

            </div>

        </div>


        <!-- =================================
             SEARCH
        ================================== -->

        <div class="search-box">

            <input
                type="text"
                id="searchSession"
                placeholder="Search by session name, book or host..."
                onkeyup="searchSessions()"
            >

        </div>


        <!-- =================================
             SESSION TABLE
        ================================== -->

        <div class="sessions-container">

            <table>

                <thead>

                    <tr>

                        <th>#</th>

                        <th>Session</th>

                        <th>Book</th>

                        <th>Host</th>

                        <th>Participants</th>

                        <th>Status</th>

                        <th>Actions</th>

                    </tr>

                </thead>


                <tbody id="sessionsTable">
                </tbody>

            </table>

        </div>


    </div>


    <!-- =================================
         JAVASCRIPT
    ================================== -->

    <script>


        /* ================================
           GET LIVE SESSIONS
        ================================= */

        let sessions =
            JSON.parse(
                localStorage.getItem(
                    "readliveLiveSessions"
                )
            ) || [];


        /* ================================
           DISPLAY SESSIONS
        ================================= */

        function renderSessions(
            sessionList = sessions
        ) {

            const table =
                document.getElementById(
                    "sessionsTable"
                );

            table.innerHTML = "";


            /* ================================
               STATISTICS
            ================================= */

            const total =
                sessions.length;


            const live =
                sessions.filter(
                    function(session) {

                        return String(
                            session.status || ""
                        )
                        .trim()
                        .toLowerCase() === "live";

                    }
                ).length;


            const ended =
                total - live;


            document.getElementById(
                "totalSessions"
            ).innerText = total;


            document.getElementById(
                "liveSessions"
            ).innerText = live;


            document.getElementById(
                "endedSessions"
            ).innerText = ended;


            /* ================================
               NO SESSIONS
            ================================= */

            if (sessionList.length === 0) {

                table.innerHTML = `

                    <tr>

                        <td colspan="7">

                            <div class="empty-message">

                                No live sessions found.

                            </div>

                        </td>

                    </tr>

                `;

                return;

            }


            /* ================================
               DISPLAY SESSIONS
            ================================= */

            sessionList.forEach(
                function(session, index) {

                    const actualIndex =
                        sessions.indexOf(session);


                    const status =
                        session.status || "Ended";


                    const normalizedStatus =
                        String(status)
                            .trim()
                            .toLowerCase();


                    const isLive =
                        normalizedStatus === "live";


                    const statusClass =
                        isLive
                            ? "live-status"
                            : "ended-status";


                    table.innerHTML += `

                        <tr>

                            <td>
                                ${index + 1}
                            </td>


                            <td>

                                <div class="session-title">

                                    ${
                                        escapeHTML(
                                            session.title ||
                                            "Reading Session"
                                        )
                                    }

                                </div>

                            </td>


                            <td>

                                <div class="book-name">

                                    ${
                                        escapeHTML(
                                            session.book ||
                                            "Book not specified"
                                        )
                                    }

                                </div>

                            </td>


                            <td>

                                ${
                                    escapeHTML(
                                        session.host ||
                                        "User"
                                    )
                                }

                            </td>


                            <td>

                                ${
                                    session.participants ||
                                    0
                                }

                            </td>


                            <td>

                                <span
                                    class="status ${statusClass}"
                                >

                                    ${escapeHTML(status)}

                                </span>

                            </td>


                            <td>

                                ${
                                    isLive
                                    ? `
                                        <button
                                            class="action-btn join-btn"
                                            onclick="joinAdminLive(${actualIndex})">

                                            Join Live

                                        </button>
                                    `
                                    : ""
                                }


                                <button
                                    class="action-btn view-btn"
                                    onclick="viewSession(${actualIndex})">

                                    View

                                </button>


                                <button
                                    class="action-btn remove-btn"
                                    onclick="removeSession(${actualIndex})">

                                    Remove

                                </button>

                            </td>

                        </tr>

                    `;

                }
            );

        }


        /* ================================
           SEARCH
        ================================= */

        function searchSessions() {

            const search =
                document
                .getElementById(
                    "searchSession"
                )
                .value
                .toLowerCase();


            const filtered =
                sessions.filter(
                    function(session) {

                        const title =
                            (
                                session.title ||
                                ""
                            ).toLowerCase();


                        const book =
                            (
                                session.book ||
                                ""
                            ).toLowerCase();


                        const host =
                            (
                                session.host ||
                                ""
                            ).toLowerCase();


                        return (
                            title.includes(search) ||
                            book.includes(search) ||
                            host.includes(search)
                        );

                    }
                );


            renderSessions(filtered);

        }


        /* ================================
           ADMIN JOIN LIVE
        ================================= */

        function joinAdminLive(index) {

            const session =
                sessions[index];


            if (!session) {

                alert(
                    "Live session not found."
                );

                return;

            }


            const status =
                String(
                    session.status || ""
                )
                .trim()
                .toLowerCase();


            if (status !== "live") {

                alert(
                    "This session is no longer live."
                );

                return;

            }


            /*
             * Tell the Live Room that
             * the person entering is Admin.
             */

            localStorage.setItem(
                "readliveCurrentLiveRole",
                "admin"
            );


            /*
             * Open the exact same session
             * that the user is currently in.
             */

            localStorage.setItem(
                "readliveCurrentLiveSession",
                JSON.stringify(session)
            );


            window.location.href =
                "live-room.html";

        }


        /* ================================
           VIEW SESSION
        ================================= */

        function viewSession(index) {

            const session =
                sessions[index];


            if (!session) {
                return;
            }


            alert(

                "Session: " +
                (session.title || "Reading Session") +

                "\n\nBook: " +
                (session.book || "Not specified") +

                "\n\nHost: " +
                (session.host || "User") +

                "\n\nParticipants: " +
                (session.participants || 0) +

                "\n\nStatus: " +
                (session.status || "Ended")

            );

        }


        /* ================================
           REMOVE SESSION
        ================================= */

        function removeSession(index) {

            if (!sessions[index]) {
                return;
            }


            const confirmRemove =
                confirm(
                    "Are you sure you want to remove this live session?"
                );


            if (!confirmRemove) {
                return;
            }


            sessions.splice(
                index,
                1
            );


            localStorage.setItem(
                "readliveLiveSessions",
                JSON.stringify(sessions)
            );


            renderSessions();

        }


        /* ================================
           SECURITY
        ================================= */

        function escapeHTML(text) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                text;

            return div.innerHTML;

        }


        /* ================================
           LOAD
        ================================= */

        renderSessions();

    </script>


</body>

</html>
