
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReadLive - Live Sessions</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .live-page { padding: 30px; }
        .live-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill,minmax(280px,1fr));
            gap: 22px;
        }
        .live-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,.08);
            transition: .2s;
        }
        .live-card:hover { transform: translateY(-3px); }
        .live-card-image {
            height: 155px;
            background: linear-gradient(135deg,#6c4cff,#a18aff);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .live-book-icon { font-size: 60px; }
        .live-badge {
            position: absolute; top: 12px; left: 12px;
            background: #e53935; color: white;
            padding: 6px 10px; border-radius: 20px;
            font-size: 12px; font-weight: bold;
        }
        .viewer-count {
            position: absolute; right: 10px; bottom: 10px;
            background: #333b; color: white;
            padding: 6px 10px; border-radius: 20px; font-size: 12px;
        }
        .live-card-content { padding: 18px; }
        .live-card-content h3 { margin: 0 0 8px; }
        .host { color: #777; font-size: 14px; }
        .live-description {
            color: #666; font-size: 13px; line-height: 1.5;
            min-height: 38px; overflow-wrap: anywhere;
        }
        .join-live-btn {
            width: 100%; border: none; border-radius: 9px;
            padding: 12px; background: #6c4cff; color: white;
            font-weight: bold; cursor: pointer;
        }
        .join-live-btn:hover { background: #5738e8; }
        .upcoming-section { margin-top: 35px; }
        #upcomingGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill,minmax(300px,1fr));
            gap: 18px;
        }
        .upcoming-card {
            background: white; border-radius: 14px; padding: 18px;
            display: flex; align-items: center; gap: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,.07);
        }
        .upcoming-date {
            background: #f0edff; border-radius: 12px;
            padding: 14px; font-size: 25px;
        }
        .upcoming-info { flex: 1; min-width: 0; }
        .upcoming-info h3 { margin: 0 0 6px; font-size: 16px; }
        .upcoming-info p, .upcoming-info span {
            font-size: 13px; color: #666; overflow-wrap: anywhere;
        }
        .remind-btn {
            background: white; color: #6c4cff;
            border: 1px solid #6c4cff; border-radius: 8px;
            padding: 9px; cursor: pointer;
        }
        .remind-btn:disabled { opacity: .7; }
        .session-message {
            grid-column: 1/-1; text-align: center;
            padding: 35px 20px; color: #666;
        }
        .session-error {
            background: #fff1f1; color: #b71c1c;
            border-radius: 12px; padding: 20px;
        }
        .retry-btn {
            border: none; border-radius: 8px;
            padding: 10px 18px; background: #6c4cff;
            color: white; cursor: pointer; margin-top: 12px;
        }
        .live-section-title {
            display: flex; align-items: center;
            justify-content: space-between; gap: 12px;
            margin: 24px 0 18px;
        }
        .live-section-title h2 { margin: 0; }
        #liveCount, #upcomingCount { color: #777; font-size: 14px; }
        @media(max-width:700px) {
            .live-page { padding: 18px; }
            .live-grid, #upcomingGrid { grid-template-columns: 1fr; }
            .upcoming-card { flex-wrap: wrap; }
            .remind-btn { width: 100%; }
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <div class="sidebar-logo">Read<span>Live</span></div>
        <nav class="sidebar-nav">
            <a href="home.html" class="side-link">🏠 <span>Home</span></a>
            <a href="books.html" class="side-link">📚 <span>Books</span></a>
            <a href="live-sessions.html" class="side-link active">🔴 <span>Live Sessions</span></a>
            <a href="search.html" class="side-link">🔍 <span>Search</span></a>
            <a href="notifications.html" class="side-link">🔔 <span>Notifications</span></a>
            <a href="profile.html" class="side-link">👤 <span>Profile</span></a>
        </nav>
    </aside>

    <div class="main-area">
        <header class="topbar">
            <div class="search-box">
                🔍
                <input type="text" id="liveSearch"
                       placeholder="Search live sessions..." autocomplete="off">
            </div>
            <div class="top-actions">
                <button type="button" id="notificationBtn" title="Notifications">🔔</button>
                <button type="button" id="messagesBtn" title="Messages">💬</button>
                <button type="button" class="top-profile" id="topProfile"
                        title="My Profile">U</button>
            </div>
        </header>

        <main class="live-page">
            <div class="live-heading">
                <h1>Live Reading Sessions</h1>
                <p>Join live discussions, book clubs and reading sessions.</p>
                <p id="lastUpdated" style="font-size:12px;color:#888"></p>
            </div>

            <section>
                <div class="live-section-title">
                    <h2>🔴 Live Now</h2>
                    <span id="liveCount">Loading...</span>
                </div>
                <div class="live-grid" id="liveGrid">
                    <div class="session-message">Loading live sessions...</div>
                </div>
            </section>

            <section class="upcoming-section">
                <div class="live-section-title">
                    <h2>📅 Upcoming Sessions</h2>
                    <span id="upcomingCount">Loading...</span>
                </div>
                <div id="upcomingGrid">
                    <div class="session-message">Loading upcoming sessions...</div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
        const LIVE_API_BASE =
            location.hostname === "localhost" || location.hostname === "127.0.0.1"
                ? "http://localhost:5000"
                : "https://readlive-backend.onrender.com";
        const LIVE_API = `${LIVE_API_BASE}/api/live-sessions`;

        let allLiveSessions = [];
        let loadingSessions = false;
        let firstLoad = true;

        function escapeHTML(value) {
            const element = document.createElement("span");
            element.textContent = String(value ?? "");
            return element.innerHTML;
        }

        function getUser() {
            try {
                return JSON.parse(
                    localStorage.getItem("readliveCurrentUser") ||
                    localStorage.getItem("user") || "null"
                ) || {};
            } catch {
                return {};
            }
        }

        function getReminders() {
            try {
                const value = JSON.parse(
                    localStorage.getItem("readliveReminders") || "[]"
                );
                return Array.isArray(value) ? value.map(String) : [];
            } catch {
                return [];
            }
        }

        function updateProfileButton() {
            const user = getUser();
            const button = document.getElementById("topProfile");
            if (!button) return;

            const name = user.username || user.name || user.email || "User";
            button.textContent = name.charAt(0).toUpperCase();
            button.title = "Profile: " + name;
        }

        function showEmpty(container, message) {
            container.innerHTML =
                '<div class="session-message">' + escapeHTML(message) + '</div>';
        }

        function sessionId(session) {
            return String(session._id || session.id || session.sessionId || "");
        }

        function normaliseSessions(payload) {
            // Support APIs returning either an array or an object containing an array.
            if (Array.isArray(payload)) return payload;
            if (payload && Array.isArray(payload.sessions)) return payload.sessions;
            if (payload && Array.isArray(payload.data)) return payload.data;
            if (payload && payload.data && Array.isArray(payload.data.sessions)) {
                return payload.data.sessions;
            }
            throw new Error("The API response did not contain a sessions array.");
        }

        async function loadLiveSessions() {
            // Prevent the 5-second refresh from overlapping a slow request.
            if (loadingSessions) return;
            loadingSessions = true;

            const liveGrid = document.getElementById("liveGrid");
            const upcomingGrid = document.getElementById("upcomingGrid");

            if (firstLoad) {
                showEmpty(liveGrid, "Loading live sessions...");
                showEmpty(upcomingGrid, "Loading upcoming sessions...");
            }

            try {
                const response = await fetch(LIVE_API, {
                    method: "GET",
                    headers: { "Accept": "application/json" },
                    cache: "no-store"
                });

                const rawText = await response.text();
                let payload;

                try {
                    payload = JSON.parse(rawText);
                } catch {
                    throw new Error("The server did not return valid JSON.");
                }

                if (!response.ok) {
                    throw new Error(
                        (payload && payload.message) ||
                        "Server returned HTTP " + response.status
                    );
                }

                allLiveSessions = normaliseSessions(payload);
                console.log("ReadLive sessions from backend:", allLiveSessions);

                renderLiveSessions();

                document.getElementById("lastUpdated").textContent =
                    "Updated: " + new Date().toLocaleTimeString();

                firstLoad = false;
            } catch (error) {
                console.error("Could not load live sessions:", error);

                if (firstLoad) {
                    liveGrid.innerHTML = `
                        <div class="session-message session-error">
                            <h3>Unable to load sessions</h3>
                            <p>${escapeHTML(error.message)}</p>
                            <p>Check that the backend is running on port 5000.</p>
                            <button class="retry-btn" id="retrySessions">Try Again</button>
                        </div>`;

                    upcomingGrid.innerHTML = "";
                    document.getElementById("retrySessions")
                        ?.addEventListener("click", loadLiveSessions);

                    document.getElementById("liveCount").textContent = "0 sessions";
                    document.getElementById("upcomingCount").textContent = "0 sessions";
                }
            } finally {
                loadingSessions = false;
            }
        }

        function renderLiveSessions() {
            const liveGrid = document.getElementById("liveGrid");
            const upcomingGrid = document.getElementById("upcomingGrid");
            const searchText = document.getElementById("liveSearch")
                .value.trim().toLowerCase();

            const filtered = allLiveSessions.filter(session => {
                const text = [
                    session.title, session.book, session.host, session.description
                ].filter(Boolean).join(" ").toLowerCase();

                return text.includes(searchText);
            });

            const live = filtered.filter(session =>
                String(session.status || "").toLowerCase() === "live"
            );

            const upcoming = filtered.filter(session =>
                String(session.status || "").toLowerCase() === "upcoming"
            );

            document.getElementById("liveCount").textContent =
                live.length + (live.length === 1 ? " session" : " sessions");

            document.getElementById("upcomingCount").textContent =
                upcoming.length + (upcoming.length === 1 ? " session" : " sessions");

            liveGrid.innerHTML = "";
            upcomingGrid.innerHTML = "";

            if (!live.length) {
                showEmpty(liveGrid, searchText
                    ? "No matching live sessions. Try another search."
                    : "No live sessions found. Create a session and check that it is saved as live.");
            }

            live.forEach(session => {
                const card = document.createElement("article");
                card.className = "live-card";

                const title = escapeHTML(session.title || "Untitled Session");
                const host = escapeHTML(session.host || "Unknown Host");
                const book = escapeHTML(session.book || "Book Discussion");
                const description = escapeHTML(
                    session.description || "Join this live reading session."
                );
                const participants = Math.max(0, Number(session.participants) || 0);

                card.innerHTML = `
                    <div class="live-card-image">
                        <span class="live-badge">● LIVE</span>
                        <div class="live-book-icon">📖</div>
                        <span class="viewer-count">👥 ${participants} watching</span>
                    </div>
                    <div class="live-card-content">
                        <h3>${title}</h3>
                        <p class="host">Hosted by ${host}</p>
                        <p>📚 ${book}</p>
                        <p class="live-description">${description}</p>
                        <button class="join-live-btn" type="button">🎥 Join Live</button>
                    </div>`;

                card.querySelector(".join-live-btn").addEventListener("click", () => {
                    joinLiveSession(session);
                });

                liveGrid.appendChild(card);
            });

            if (!upcoming.length) {
                showEmpty(upcomingGrid, searchText
                    ? "No matching upcoming sessions."
                    : "No upcoming sessions found.");
            }

            upcoming.forEach(session => {
                const card = document.createElement("article");
                card.className = "upcoming-card";

                const id = sessionId(session);
                const reminders = getReminders();
                const reminded = id && reminders.includes(id);

                card.innerHTML = `
                    <div class="upcoming-date">📅</div>
                    <div class="upcoming-info">
                        <h3>${escapeHTML(session.title || "Untitled Session")}</h3>
                        <p>Hosted by ${escapeHTML(session.host || "Unknown Host")}</p>
                        <p>📚 ${escapeHTML(session.book || "Book Discussion")}</p>
                        <span>🕐 ${escapeHTML(session.scheduledDate || "Date TBA")}
                        · ${escapeHTML(session.scheduledTime || "Time TBA")}</span>
                    </div>
                    <button class="remind-btn" type="button"
                        ${reminded ? "disabled" : ""}>
                        ${reminded ? "✅ Reminder Set" : "🔔 Remind Me"}
                    </button>`;

                card.querySelector(".remind-btn").addEventListener("click", event => {
                    if (!id) {
                        alert("This session does not have a valid ID.");
                        return;
                    }

                    const current = getReminders();
                    if (!current.includes(id)) current.push(id);

                    localStorage.setItem("readliveReminders", JSON.stringify(current));
                    event.currentTarget.textContent = "✅ Reminder Set";
                    event.currentTarget.disabled = true;
                });

                upcomingGrid.appendChild(card);
            });
        }

        function joinLiveSession(session) {
            const id = sessionId(session);

            if (!id) {
                alert("This session has no valid ID. Please refresh and try again.");
                console.error("Invalid live session:", session);
                return;
            }

            localStorage.setItem("readliveCurrentLiveSession", JSON.stringify({
                ...session,
                _id: id
            }));

            window.location.href = "live-room.html";
        }

        document.addEventListener("DOMContentLoaded", function() {
            updateProfileButton();

            document.getElementById("liveSearch")
                .addEventListener("input", renderLiveSessions);

            document.getElementById("notificationBtn")
                .addEventListener("click", () => {
                    window.location.href = "notifications.html";
                });

            document.getElementById("messagesBtn")
                .addEventListener("click", () => {
                    const current = localStorage.getItem("readliveCurrentLiveSession");
                    if (current) {
                        window.location.href = "live-room.html";
                    } else {
                        alert("Join a live reading session first to access live chat.");
                    }
                });

            document.getElementById("topProfile")
                .addEventListener("click", () => {
                    window.location.href = "profile.html";
                });

            loadLiveSessions();
            setInterval(loadLiveSessions, 5000);
        });
    </script>
</body>
</html>
