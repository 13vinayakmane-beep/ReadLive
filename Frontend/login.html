<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ReadLive - Login</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* USER / ADMIN LOGIN */

        .login-options {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .login-option {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f5f5f5;
            color: #555;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-option.active {
            background: #6c4ab6;
            color: white;
            border-color: #6c4ab6;
        }

        .login-role-text {
            text-align: center;
            margin-bottom: 20px;
            color: #666;
            font-size: 14px;
        }

    </style>

</head>


<body>


    <div class="auth-container">


        <div class="auth-card login-card">


            <!-- LOGO -->

            <div class="logo">
                Read<span>Live</span>
            </div>


            <h1>Welcome Back!</h1>


            <p class="subtitle">
                Login to continue your reading journey.
            </p>


            <!-- USER / ADMIN OPTIONS -->

            <div class="login-options">

                <button
                    type="button"
                    id="userLoginBtn"
                    class="login-option active"
                    onclick="selectLoginType('user')">

                    User Login

                </button>


                <button
                    type="button"
                    id="adminLoginBtn"
                    class="login-option"
                    onclick="selectLoginType('admin')">

                    Admin Login

                </button>

            </div>


            <p
                id="loginRoleText"
                class="login-role-text">

                Login as a User

            </p>


            <!-- LOGIN FORM -->

            <form id="loginForm">


                <div class="form-group">

                    <label>
                        Email or Username
                    </label>


                    <input
                        type="text"
                        id="loginUser"
                        placeholder="Enter email or username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>


                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="forgot-password">

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="main-btn"
                    id="loginButton">

                    Login

                </button>


            </form>


            <!-- REGISTRATION -->

            <p class="bottom-text">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>


        </div>

    </div>


    <script src="script.js"></script>


</body>

</html>
